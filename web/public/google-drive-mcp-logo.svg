<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="brand-bg" x1="12" y1="8" x2="116" y2="124" gradientUnits="userSpaceOnUse">
      <stop stop-color="#08766C"/>
      <stop offset="1" stop-color="#034B46"/>
    </linearGradient>
    <linearGradient id="brand-glow" x1="86" y1="14" x2="116" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#brand-bg)"/>
  <path d="M87 8h13a20 20 0 0 1 20 20v13" stroke="url(#brand-glow)" stroke-width="12" stroke-linecap="round"/>

  <!-- Distinctive Drive letterform -->
  <path
    transform="translate(-7 0)"
    fill="#fff"
    fill-rule="evenodd"
    d="M35 25h36c29 0 46 15 46 39S99 103 70 103H34V25Zm14 14v50h22c20 0 32-9 32-25S90 39 70 39H48Z"
  />

  <!-- Original Google Drive mark -->
  <g transform="translate(43 39) scale(0.25)">
    <mask id="drive-mask" width="168" height="154" x="12" y="18" maskUnits="userSpaceOnUse">
      <path fill="#fff" d="M63.09 37c14.626-25.333 51.193-25.334 65.819 0l45.033 78c14.626 25.334-3.657 57.001-32.91 57.001H50.967c-29.253 0-47.536-31.667-32.91-57.001z"/>
    </mask>
    <g mask="url(#drive-mask)">
      <path fill="url(#drive-yellow)" d="M206.905 172.02h-91.888l-19.015-32.934 45.944-79.578z"/>
      <path fill="url(#drive-blue)" d="M-14.919 172.006 50.04 59.494v.002L31.032 92.422h38.02L115 172.004l-129.918.001z"/>
      <path fill="url(#drive-green)" d="M96.007-20.085 141.954 59.5l-19.011 32.928H31.048z"/>
    </g>
    <defs>
      <linearGradient id="drive-yellow" x1="193.6" x2="103.09" y1="165.6" y2="111.21" gradientUnits="userSpaceOnUse">
        <stop offset=".09" stop-color="#ffe921"/><stop offset="1" stop-color="#fec700"/>
      </linearGradient>
      <linearGradient id="drive-blue" x1="114.4" x2="15.53" y1="181.61" y2="121.8" gradientUnits="userSpaceOnUse">
        <stop offset=".15" stop-color="#a9a8ff"/><stop offset=".33" stop-color="#6d97ff"/><stop offset=".48" stop-color="#3186ff"/>
      </linearGradient>
      <linearGradient id="drive-green" x1="128.88" x2="28.7" y1="37.88" y2="84.64" gradientUnits="userSpaceOnUse">
        <stop offset=".55" stop-color="#0ebc5f"/><stop offset=".85" stop-color="#78c9ff"/>
      </linearGradient>
    </defs>
  </g>

  <!-- MCP connection nodes -->
  <path d="M99 91h8l7 7" stroke="#fff" stroke-opacity=".9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="98" cy="91" r="4.5" fill="#FBBF24" stroke="#075E57" stroke-width="2"/>
  <circle cx="108" cy="91" r="4" fill="#22C55E" stroke="#075E57" stroke-width="2"/>
  <circle cx="115" cy="99" r="4" fill="#3B82F6" stroke="#075E57" stroke-width="2"/>
